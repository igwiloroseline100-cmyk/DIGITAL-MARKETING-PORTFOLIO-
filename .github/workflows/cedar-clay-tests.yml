name: Cedar & Clay Store Checks
on:
  push:
    paths:
      - "cedar-clay-store/**"
      - ".github/workflows/cedar-clay-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify store files and JavaScript
        run: node --test cedar-clay-store/tests/smoke.mjs
